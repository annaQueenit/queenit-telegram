# Автопостинг новых материалов queenit.info в Telegram-канал.
# Раз в 15 минут забирает очередь с сайта, публикует посты ботом и отмечает их отправленными.
# Заодно запускает на сайте публикацию по расписанию (выпуски выходят вовремя, даже если на сайт никто не зашёл).
# Если у материала есть обложка — пост уходит фото с подписью; не получилось — обычным текстом.
# Секреты репозитория: TG_BOT_TOKEN (токен @anna_agent_inbox_bot), QUEENIT_TG_KEY (ключ из админки сайта → Telegram).
name: queenit-telegram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: queenit-telegram
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Забрать очередь и опубликовать
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          KEY: ${{ secrets.QUEENIT_TG_KEY }}
        run: |
          set -euo pipefail
          API="https://api.telegram.org/bot${TOKEN}"
          FAIL='{"ok":false,"description":"нет связи с Telegram"}'
          Q=$(curl -fsS --max-time 60 "https://queenit.info/api/tg-queue.php?key=${KEY}")
          echo "$Q" | jq -r '"В очереди: \(.items|length)"'
          echo "$Q" | jq -c '.items[]' | while read -r item; do
            id=$(echo "$item" | jq -r .id)
            photo=$(echo "$item" | jq -r '.photo // ""')
            res='{"ok":false}'
            if [ -n "$photo" ] && curl -fsS --max-time 60 -o cover.img "$photo"; then
              echo "$item" | jq -r .payload.text > caption.txt
              echo "$item" | jq -c .payload.reply_markup > markup.json
              res=$(curl -sS --max-time 60 --form-string "chat_id=$(echo "$item" | jq -r .payload.chat_id)" -F "photo=@cover.img" \
                -F "caption=<caption.txt" -F parse_mode=HTML -F "reply_markup=<markup.json" "$API/sendPhoto" || echo "$FAIL")
              [ "$(echo "$res" | jq -r .ok)" = "true" ] || echo "С обложкой не вышло ($(echo "$res" | jq -r .description)), отправляю текстом"
            fi
            if [ "$(echo "$res" | jq -r .ok)" != "true" ]; then
              res=$(curl -sS --max-time 30 -H 'Content-Type: application/json' -d "$(echo "$item" | jq -c .payload)" "$API/sendMessage" || echo "$FAIL")
            fi
            if [ "$(echo "$res" | jq -r .ok)" = "true" ]; then
              body=$(jq -nc --arg id "$id" --argjson m "$(echo "$res" | jq .result.message_id)" '{id:$id,message_id:$m}')
              echo "Опубликовано: $(echo "$item" | jq -r .title)"
            else
              body=$(jq -nc --arg id "$id" --arg e "$(echo "$res" | jq -r .description)" '{id:$id,error:$e}')
              echo "Ошибка: $(echo "$res" | jq -r .description)"
            fi
            curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' -d "$body" "https://queenit.info/api/tg-queue.php?key=${KEY}" >/dev/null
            rm -f cover.img caption.txt markup.json
            sleep 3
          done
